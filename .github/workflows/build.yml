name: Build Myra APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Keystore
        run: |
          if [ ! -f app/myra.keystore ]; then
            keytool -genkeypair -keystore app/myra.keystore -alias myra -keyalg RSA -keysize 2048 -validity 10000 -storepass myra1234 -keypass myra1234 -dname "CN=Myra, C=IN"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add app/myra.keystore
            git commit -m "keystore [skip ci]" || true
            git push || true
          fi
      - name: APK banao
        run: gradle assembleDebug --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk Myra.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Myra-APK
          path: Myra.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Myra v${{ github.run_number }}
          files: Myra.apk
